# Dependency policy for the Audit workflow.
#
# The verification and release gates stay hermetic and reproducible, so the
# advisory database is queried here instead: this file states which licences and
# which package sources the pinned graph in Cargo.lock is allowed to contain.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2026-0009: stack exhaustion in `time`'s RFC 2822 date parser.
    #
    # Not reachable from this dependency graph. The workspace parses dates only
    # as RFC 3339 (execution deadlines), and `cookie 0.18.2` — the one crate that
    # parses remote date input, from `Set-Cookie` `Expires` — uses its own
    # `format_description!` items rather than the RFC 2822 parser the advisory
    # concerns.
    #
    # It stays listed rather than dismissed because the reachability argument is
    # about today's lockfile: `time` >= 0.3.47 fixes it but declares
    # rust-version 1.88.0, above the published MSRV 1.85.1, so the lockfile
    # cannot simply be updated. The Audit workflow fails if this exemption
    # outlives an MSRV bump to 1.88.
{ id = "RUSTSEC-2026-0009", reason = "vulnerable RFC 2822 parser is not reachable here; no fixed release builds on the published MSRV 1.85.1" },
]

[licenses]
version = 2
# Every licence currently present in Cargo.lock. Adding a dependency under a
# different licence must be an explicit decision, not a silent one.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# The detached fuzz crate (fuzz/Cargo.lock, audited by the same policy) links
# LLVM's libFuzzer through libfuzzer-sys, whose bundled C++ sources are under
# the University of Illinois/NCSA licence (OSI approved, permissive). The
# exception is scoped to that crate: it never enters the published crate or
# the wheel, and NCSA stays refused for every other dependency.
exceptions = [
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The PyO3 extension depends on the core crate by path inside this workspace,
# which is not the unpinned registry dependency the wildcard check targets.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
