# Dependency policy for the Audit workflow.
#
# The verification and release gates stay hermetic and reproducible, so the
# advisory database is queried here instead: this file states which licences and
# which package sources the pinned graph in Cargo.lock is allowed to contain.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# No advisory is exempted. An exemption is accepted only while no fixed
# release builds on the published MSRV, with its reason written here and
# its bound in scripts/check_advisory_exemptions.py.
ignore = []

[licenses]
version = 2
# Every licence currently present in Cargo.lock. Adding a dependency under a
# different licence must be an explicit decision, not a silent one.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# The detached fuzz crate (fuzz/Cargo.lock, audited by the same policy) links
# LLVM's libFuzzer through libfuzzer-sys, whose bundled C++ sources are under
# the University of Illinois/NCSA licence (OSI approved, permissive). The
# exception is scoped to that crate: it never enters the published crate or
# the wheel, and NCSA stays refused for every other dependency.
exceptions = [
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
]

# The workspace crates are proprietary and unpublished (publish = false), not
# third-party dependencies. This does not touch the allowlist above: every
# external dependency is still checked against it.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The PyO3 extension depends on the core crate by path inside this workspace,
# which is not the unpinned registry dependency the wildcard check targets.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
