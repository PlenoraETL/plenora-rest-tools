name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The Windows abi3 wheel is built natively and tested installed on every
  # supported CPython before the release job may use it. The Windows CLI
  # executable is built by the same job and answers --version before it is
  # kept. Both join the release bundle, the SBOM, SHA256SUMS and both
  # attestations; they have no committed digest in adoption-manifest.json
  # because the runner image that links them is not pinned the way the Linux
  # builder image is.
  windows-wheel:
    name: Windows abi3 wheel and CLI
    if: github.repository == 'PlenoraETL/plenora-rest-tools'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate tag and component versions
        shell: bash
        run: python scripts/release.py validate-version "${GITHUB_REF_NAME}"

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.98.1
        with:
          toolchain: '1.98.1'

      - name: Build the wheel
        shell: pwsh
        run: |
          $env:SOURCE_DATE_EPOCH = (python scripts/release.py source-date-epoch).Trim()
          python -m pip install --disable-pip-version-check --no-cache-dir "maturin==1.14.1"
          python -m maturin build --release --locked --strip --out windows-wheel
          if ($LASTEXITCODE -ne 0) { throw "maturin build failed" }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wheel-windows-x86_64
          path: windows-wheel/*.whl
          if-no-files-found: error
          retention-days: 7

      - name: Build and smoke-test the CLI executable
        shell: pwsh
        run: |
          $env:SOURCE_DATE_EPOCH = (python scripts/release.py source-date-epoch).Trim()
          cargo build --release --locked --package plenora-rest-cli --bin plenora-rest
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }
          New-Item -ItemType Directory -Force -Path windows-cli | Out-Null
          Copy-Item -LiteralPath target/release/plenora-rest.exe -Destination windows-cli/plenora-rest-windows-x86_64.exe
          $version = (python scripts/release.py current-version 2>$null | Select-Object -Last 1).Trim()
          $answer = & ./windows-cli/plenora-rest-windows-x86_64.exe --version --format json
          if ($LASTEXITCODE -ne 0) { throw "the CLI executable does not answer --version" }
          $document = $answer | ConvertFrom-Json
          if ($document.status -ne "ok" -or $document.result.component_version -ne $version) {
            throw "the CLI executable reports an unexpected version"
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-cli-windows-x86_64
          path: windows-cli/plenora-rest-windows-x86_64.exe
          if-no-files-found: error
          retention-days: 7

  windows-abi3:
    name: Windows wheel on CPython ${{ matrix.python }}
    needs: windows-wheel
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-wheel-windows-x86_64
          path: windows-wheel

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install the wheel in a clean environment and run the SDK suite
        shell: pwsh
        run: ./scripts/test_wheel.ps1 -WheelDirectory windows-wheel

  github-release:
    name: Reproducible GitHub release
    if: github.repository == 'PlenoraETL/plenora-rest-tools'
    needs: windows-abi3
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and component versions
        id: version
        shell: bash
        run: |
          version="$(python3 scripts/release.py validate-version "${GITHUB_REF_NAME}")"
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Run the complete verification gate
        shell: pwsh
        run: ./scripts/verify.ps1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-wheel-windows-x86_64
          path: ${{ runner.temp }}/windows-extra

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-cli-windows-x86_64
          path: ${{ runner.temp }}/windows-extra

      - name: Build twice, compare, add the Windows wheel and CLI, and generate the SBOM
        shell: pwsh
        run: ./scripts/release.ps1 -ExtraArtifacts "${{ runner.temp }}/windows-extra"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Attest the SBOM for binary artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.crate
            dist/*.whl
            dist/plenora-rest-linux-x86_64
            dist/plenora-rest-windows-x86_64.exe
          sbom-path: dist/plenora-rest-tools-${{ steps.version.outputs.value }}.spdx.json

      - name: Retain the release bundle in Actions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plenora-rest-tools-${{ steps.version.outputs.value }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; refusing to replace signed assets."
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --title "plenora-rest-tools ${{ steps.version.outputs.value }}" \
            --generate-notes
