[workspace]
members = [
    "crates/rest-engine-core",
    "crates/rest-engine-python",
]
resolver = "3"

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["PlenoraETL contributors"]
repository = "https://github.com/PlenoraETL/plenora-rest-tools"

[workspace.dependencies]
base64 = "0.22"
csv = "1.3"
futures-util = "0.3"
httpdate = "1.0"
percent-encoding = "2.3"
quick-xml = "0.38"
pyo3 = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "charset", "cookies", "deflate", "gzip", "http2", "json", "multipart", "rustls-tls", "stream", "zstd"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }
