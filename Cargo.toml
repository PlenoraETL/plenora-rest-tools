[workspace]
members = [
    "crates/rest-engine-core",
    "crates/rest-engine-python",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Rest Engine contributors"]

[workspace.dependencies]
base64 = "0.22"
csv = "1.3"
futures-util = "0.3"
httpdate = "1.0"
percent-encoding = "2.3"
quick-xml = "0.38"
pyo3 = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "charset", "deflate", "gzip", "http2", "json", "multipart", "rustls-tls", "stream", "zstd"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["net", "rt-multi-thread", "sync", "time"] }
url = "2.5"
