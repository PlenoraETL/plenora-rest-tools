[workspace]
members = [
    "crates/rest-cli",
    "crates/rest-engine-core",
    "crates/rest-engine-python",
]
resolver = "3"

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.85.1"
license = "MIT OR Apache-2.0"
authors = ["PlenoraETL contributors"]
repository = "https://github.com/PlenoraETL/plenora-rest-tools"

# The ban on `unsafe` covers every target of every crate, tests and examples
# included, not only the library roots that repeat it as a crate attribute.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# Every direct dependency is pinned to the exact version in Cargo.lock.
#
# A caret requirement lets `cargo update`, or a downstream resolution, pick a
# different release than the one the gates qualified, so the manifest would no
# longer say what was tested. With `=x.y.z` a version change is always an
# explicit edit of this file, reviewed in its own pull request, and the Audit
# workflow sees the same graph the tests ran on. Transitive dependencies are
# fixed by Cargo.lock, which every gate uses with --locked.
#
# `time` stays at 0.3.45: 0.3.47, the first release with the fix for
# RUSTSEC-2026-0009, declares rust-version 1.88.0, above the published MSRV
# (see deny.toml for why the advisory is not reachable here).
base64 = "=0.22.1"
csv = "=1.4.0"
futures-util = "=0.3.34"
# 128-bit random values for cookie session handles straight from the system
# source. Already in the graph through uuid and pinned to the exact version
# uuid resolves to, so Cargo.lock gains only the direct dependency edge.
getrandom = "=0.4.3"
httpdate = "=1.0.3"
percent-encoding = "=2.3.2"
quick-xml = "=0.41.0"
pyo3 = "=0.29.2"
reqwest = { version = "=0.12.28", default-features = false, features = ["brotli", "charset", "cookies", "deflate", "gzip", "http2", "json", "multipart", "rustls-tls", "stream", "zstd"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
time = { version = "=0.3.45", features = ["parsing"] }
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["io", "rt"] }
url = "=2.5.8"
uuid = { version = "=1.24.1", features = ["v4"] }
