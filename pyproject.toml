[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "plenora-rest"
version = "0.2.2"
description = "Self-contained, service-agnostic REST execution engine for Python"
requires-python = ">=3.10,<3.15"
license = "MIT OR Apache-2.0"
readme = "README.md"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/PlenoraETL/plenora-rest-tools"

[tool.maturin]
manifest-path = "crates/rest-engine-python/Cargo.toml"
python-source = "python"
module-name = "plenora_rest._native"
