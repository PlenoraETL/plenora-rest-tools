[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "rust-rest-engine"
version = "0.1.0"
description = "Self-contained, service-agnostic REST execution engine for Python"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
readme = "README.md"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[tool.maturin]
manifest-path = "crates/rest-engine-python/Cargo.toml"
python-source = "python"
module-name = "rest_engine._native"
