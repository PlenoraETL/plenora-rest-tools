[build-system]
# Exact pin, the same maturin every gate builds with: a range would let an
# sdist build pick a release the gates never qualified.
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "plenora-rest"
version = "0.4.0"
description = "Self-contained, service-agnostic REST execution engine for Python"
requires-python = ">=3.14"
license = { text = "Proprietary" }
readme = "README.md"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/PlenoraETL/plenora-rest-tools"

[tool.maturin]
manifest-path = "crates/rest-engine-python/Cargo.toml"
python-source = "python"
module-name = "plenora_rest._native"
