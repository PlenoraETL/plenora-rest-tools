[package]
name = "plenora-rest-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Python SDK for the self-contained REST execution engine"
# Distributed only as the plenora-rest wheel built by maturin. It is never
# published to crates.io, which is also why it may depend on the core crate by
# workspace path.
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { workspace = true, features = ["abi3-py310", "extension-module"] }
plenora-rest-core = { path = "../rest-engine-core" }
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true
